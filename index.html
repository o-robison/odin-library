<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BestReads</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>Title</th>
                <th>Author</th>
                <th>Pages</th>
                <th>Read?</th>
                <th></th>
            </tr>
        </thead>
        <tbody>

        </tbody>
    </table>

    <button id="addBook">Add Book</button>

    <dialog id="addBookDialog">
        <button autofocus id="closeDialog">Close</button>
        <form id="addBookForm">
            <div class="formRow">
                <label for="title">Title*</label>
                <input type="text" id="title" required>
            </div>
            <div class="formRow">
                <label for="author">Author*</label>
                <input type="text" id="author" required>
            </div>
            <div class="formRow">
                <label for="numPages">Number of Pages*</label>
                <input type="number" id="numPages" required>
            </div>
            <div class="formRow">
                <label for="isRead">Read?</label>
                <input type="checkbox" id="isRead">
            </div>
            <button type="submit" id="submitBook">Save Book</button>
        </form>
    </dialog>

    <script src="script.js"></script>
</body>
</html>
